
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 英文學習平台</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef7f0;
      text-align: center;
      padding: 40px 16px;
    }
    .card {
      max-width: 450px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 15px #0001;
    }
    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #dcfce7; }
    #result { font-weight: bold; }
  </style>
</head>

<body>
  <div class="card">
    <h1>English Adventure</h1>
    <p>Unit 1：英文基礎</p>
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="result"></p>
    <button id="next" onclick="nextQuestion()" hidden>
      下一題 →
    </button>
  </div>

  <script>
    const questions = [
      {
        question: "I ___ a student.",
        options: ["am", "is", "are", "be"],
        answer: 0
      },
      {
        question: "She ___ happy.",
        options: ["am", "is", "are", "be"],
        answer: 1
      },
      {
        question: "They ___ friends.",
        options: ["am", "is", "are", "be"],
        answer: 2
      }
    ];

    let current = 0;

    function showQuestion() {
      const q = questions[current];

      document.getElementById("question").textContent =
        q.question;
      document.getElementById("result").textContent = "";
      document.getElementById("next").hidden = true;

      const area = document.getElementById("options");
      area.innerHTML = "";

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = () => checkAnswer(index);
        area.appendChild(btn);
      });
    }

    function checkAnswer(choice) {
      const q = questions[current];
      const correct = choice === q.answer;

      document.getElementById("result").textContent =
        correct
          ? "答對了！Excellent!"
          : "答錯了！正確答案是 " + q.options[q.answer];

      document.querySelectorAll("#options button")
        .forEach(btn => btn.disabled = true);

      document.getElementById("next").hidden = false;
    }

    function nextQuestion() {
      current++;

      if (current >= questions.length) {
        current = 0;
        alert("完成本輪英文練習！");
      }
      showQuestion();
    }

    showQuestion();
  </script>
</body>
</html>
